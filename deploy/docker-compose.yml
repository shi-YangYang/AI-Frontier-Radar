services:
  app:
    image: ${IMAGE_REF:-ghcr.io/shi-yangyang/ai-frontier-radar:latest}
    container_name: ai-frontier-radar
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./.data:/app/.data
      - ./wechat-bridge/.state:/app/wechat-bridge/.state
      - ./.x-browser-public-profile:/app/.x-browser-public-profile
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    container_name: ai-frontier-radar-caddy
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-example.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_config:
  caddy_data:
