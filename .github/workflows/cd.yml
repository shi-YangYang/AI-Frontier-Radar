name: CD

# 手动触发：GitHub → Actions → CD → Run workflow
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要部署的 Git 引用（分支 / 标签 / 提交 SHA）'
        required: true
        default: master
        type: string
      run_checks:
        description: '构建镜像前运行类型检查与 smoke 测试'
        required: true
        default: true
        type: boolean
      image_tag:
        description: '镜像标签（默认使用提交短 SHA；回滚时可填历史标签）'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    outputs:
      image_name: ${{ steps.tag.outputs.image_name }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
      revision: ${{ steps.tag.outputs.revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve revision and image tag
        id: tag
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          image_tag="${{ inputs.image_tag }}"
          if [ -z "$image_tag" ]; then
            image_tag="$short_sha"
          fi
          # GHCR 要求镜像名全小写
          echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: inputs.run_checks
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: inputs.run_checks
        run: npm ci

      - name: Generate Prisma Client
        if: inputs.run_checks
        run: npm run prisma:generate

      - name: Typecheck (backend + admin)
        if: inputs.run_checks
        run: npm run typecheck

      - name: E2E smoke
        if: inputs.run_checks
        run: npm run smoke:e2e

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.image_name }}:${{ steps.tag.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary (build)
        run: |
          {
            echo "### 镜像已推送"
            echo ""
            echo "- 引用：\`${{ inputs.ref }}\`"
            echo "- 提交：\`${{ steps.tag.outputs.revision }}\`"
            echo "- 镜像：\`${{ env.REGISTRY }}/${{ steps.tag.outputs.image_name }}:${{ steps.tag.outputs.image_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/ai-frontier-radar' }}
      IMAGE_REF: ghcr.io/${{ needs.build.outputs.image_name }}:${{ needs.build.outputs.image_tag }}
    steps:
      - name: Checkout (deploy files)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: deploy

      - name: Validate required secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "缺少必要 Secret：$name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "请配置 SSH_HOST、SSH_USER、SSH_PRIVATE_KEY 三个 Secrets 后重试。" >&2
            exit 1
          fi

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "未配置 SSH_KNOWN_HOSTS，改用 ssh-keyscan（建议后续固定 host key）"
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Sync compose file
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -o IdentitiesOnly=yes \
            deploy/docker-compose.yml "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/docker-compose.yml"

      - name: Pull and restart
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' IMAGE_REF='$IMAGE_REF' GHCR_PULL_TOKEN='$GHCR_PULL_TOKEN' GHCR_USER='${{ github.repository_owner }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          mkdir -p .data wechat-bridge/.state .x-browser-public-profile .deploy

          if [ -n "${GHCR_PULL_TOKEN}" ]; then
            echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          fi

          echo "[deploy] 拉取镜像：$IMAGE_REF"
          docker compose pull app

          echo "[deploy] 启动容器"
          docker compose up -d --remove-orphans

          echo "[deploy] 健康检查"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1; then
              printf 'image=%s\ndeployed_at=%s\n' "$IMAGE_REF" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy/last-deploy.txt
              echo "[deploy] 健康检查通过"
              exit 0
            fi
            sleep 2
          done

          echo "[deploy] 健康检查失败，最近日志：" >&2
          docker compose logs --tail 50 app >&2 || true
          exit 1
          REMOTE

      - name: Summary (deploy)
        run: |
          {
            echo "### 部署完成"
            echo ""
            echo "- 引用：\`${{ inputs.ref }}\`"
            echo "- 提交：\`${{ needs.build.outputs.revision }}\`"
            echo "- 镜像：\`${{ env.IMAGE_REF }}\`"
            echo "- 服务器：\`${{ env.SSH_USER }}@${{ env.SSH_HOST }}:${{ env.DEPLOY_PATH }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
